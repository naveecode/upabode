services:
  - type: web
    name: orbit-app
    env: node
    plan: free
    region: singapore
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: PUSHER_APP_ID
        sync: false
      - key: NEXT_PUBLIC_PUSHER_KEY
        sync: false
      - key: PUSHER_SECRET
        sync: false
      - key: NEXT_PUBLIC_PUSHER_CLUSTER
        sync: false
      - key: UPLOADTHING_TOKEN
        sync: false
